<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="CINEMAG 무API AI 영상 제작 설계기"/><title>CINEMAG AI VIDEO CREATIVE STUDIO</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>window.addEventListener('DOMContentLoaded',()=>{const attach=()=>{const actions=document.querySelector('.header-actions');if(!actions||actions.querySelector('[data-new-project]'))return;const btn=document.createElement('button');btn.type='button';btn.textContent='새로 만들기';btn.setAttribute('data-new-project','true');btn.addEventListener('click',()=>{window.location.reload();});actions.insertBefore(btn,actions.lastElementChild);};attach();new MutationObserver(attach).observe(document.body,{childList:true,subtree:true});});</script></body></html>
